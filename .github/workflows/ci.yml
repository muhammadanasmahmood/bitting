name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to immutable commit SHAs (supply-chain hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev and optional extras
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e '.[dev,fastapi,argon2]'

      - name: Lint (ruff)
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Type-check (mypy, strict)
        run: mypy

      - name: Test (pytest)
        run: pytest

  # Auditing once on a single modern Python is deliberate: the review
  # toolchain's own transitive dependencies (e.g. filelock < 4.2.1) have
  # unfixed advisories on older interpreters, which would make a per-
  # version audit matrix impossible to keep green.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install '.[fastapi,argon2]' pip-audit build

      - name: Audit dependencies
        run: pip-audit --skip-editable

      - name: Build distributions
        run: python -m build --wheel --sdist

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret scan for staged patterns
        run: |
          ! grep -rInE "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --exclude-dir=.git --exclude-dir=.venv .
