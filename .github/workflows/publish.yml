name: publish

# Tag-driven PyPI release via Trusted Publishing (OIDC) — no long-lived tokens.
# One-time setup on pypi.org (Project → Publishing → Add trusted publisher):
#   PyPI project name:  bitting
#   Owner:              muhammadanasmahmood
#   Repository:         bitting
#   Workflow name:      publish.yml
#   Environment name:   pypi        (also create this GitHub Environment in repo Settings)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev,argon2,fastapi]
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
